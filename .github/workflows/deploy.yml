name: Deploy site

# workflow_run is safe here: the job only runs for successful `push` runs of
# ci.yml on main in this repository, never checks out code, and re-verifies the
# source run through the API before downloading its artifact.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: ID of a successful CI run on main whose artifact to deploy (rollback)
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.publish.outputs.url }}
    permissions:
      actions: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
    steps:
      # Deploy only an artifact built by ci.yml from a push to main in this repo.
      - name: Verify source CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::ci_run_id must be numeric"; exit 1; }
          run="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          jq -e --arg repo "$REPO" '
            .path == ".github/workflows/ci.yml" and .event == "push" and
            .head_branch == "main" and .conclusion == "success" and
            .head_repository.full_name == $repo' <<<"$run" >/dev/null \
            || { echo "::error::Run $RUN_ID is not a successful CI push to main."; exit 1; }
          sha="$(jq -r .head_sha <<<"$run")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying ${sha} from CI run ${RUN_ID}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: dist
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Check artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          ls dist/assets/*.js >/dev/null

      - name: Show OIDC subject
        run: |
          token="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          p="$(cut -d. -f2 <<<"$token" | tr '_-' '/+')"
          while (( ${#p} % 4 )); do p+="="; done
          echo "OIDC sub: $(base64 -d <<<"$p" | jq -r .sub)"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/hacklonega-github-deploy
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish
        id: publish
        env:
          BUCKET: hacklonega-site-${{ vars.AWS_ACCOUNT_ID }}
        run: |
          dist_id="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='hacklonega-site'].Id | [0]" --output text)"
          [[ "$dist_id" =~ ^E[A-Z0-9]+$ ]] || { echo "::error::Distribution not found"; exit 1; }
          read -r cf_domain alias < <(aws cloudfront list-distributions --output text \
            --query "DistributionList.Items[?Id=='$dist_id'] | [0].[DomainName, Aliases.Items[0]]")
          domain="$cf_domain"; [[ "$alias" != "None" && -n "$alias" ]] && domain="$alias"

          # 1. Hashed assets first. Old ones stay so open tabs keep working.
          aws s3 sync dist/assets "s3://$BUCKET/assets" --only-show-errors \
            --cache-control "public, max-age=31536000, immutable"
          # 2. Other root files (favicon, OG image, 404 page) at a moderate TTL.
          aws s3 sync dist "s3://$BUCKET" --only-show-errors --delete \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "public, max-age=3600"
          # 3. index.html last, so it never references assets that are not uploaded yet.
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --only-show-errors \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"

          mapfile -t paths < <(cd dist && find . -maxdepth 1 -type f | sed 's|^\.||')
          inv="$(aws cloudfront create-invalidation --distribution-id "$dist_id" \
            --paths / "${paths[@]}" --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$dist_id" --id "$inv"

          echo "url=https://$domain/" >> "$GITHUB_OUTPUT"
          echo "Live at https://$domain/ (invalidation $inv)" >> "$GITHUB_STEP_SUMMARY"
