name: Infrastructure

# Pull requests only get the offline checks in ci.yml. This repository is
# public, so no pull request can reach AWS credentials.
on:
  push:
    branches: [main]
    paths:
      - infra/site/**
      - .github/workflows/terraform.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-site
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: 1.15.8
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infrastructure-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    defaults:
      run:
        working-directory: infra/site
    env:
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
      # Read-only DNS token in this environment. Unset until Phase 3.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Show OIDC subject
        run: ../../scripts/show-oidc-sub.sh

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/hacklonega-github-plan
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -lockfile=readonly -backend-config="bucket=hacklonega-tfstate-${AWS_ACCOUNT_ID}"

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          [ "$code" -eq 1 ] && exit 1
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(../../scripts/plan-fingerprint.sh tfplan)" >> "$GITHUB_OUTPUT"
          {
            echo '### Terraform plan'
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f tfplan

  apply:
    name: Apply
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Required reviewers: approving this job approves the plan shown in the Plan job.
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/site
    env:
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
      # DNS edit token for the one zone. Unset until Phase 3.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      REVIEWED_FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Show OIDC subject
        run: ../../scripts/show-oidc-sub.sh

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/hacklonega-github-apply
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -lockfile=readonly -backend-config="bucket=hacklonega-tfstate-${AWS_ACCOUNT_ID}"

      # Plan files can hold sensitive values and artifacts are public on this
      # repository, so apply re-plans and refuses anything but the reviewed plan.
      - name: Re-plan and compare with the reviewed plan
        run: |
          terraform plan -lock-timeout=5m -out=tfplan
          actual="$(../../scripts/plan-fingerprint.sh tfplan)"
          if [ "$actual" != "$REVIEWED_FINGERPRINT" ]; then
            echo "::error::The plan changed after review. Re-run the workflow and review the new plan."
            exit 1
          fi

      - run: terraform apply -lock-timeout=5m tfplan

      - name: Outputs
        run: terraform output -no-color >> "$GITHUB_STEP_SUMMARY"
